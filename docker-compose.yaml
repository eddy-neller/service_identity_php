
name: en_shop_api

services:
###> doctrine/doctrine-bundle ###
  database:
    container_name: en_shop_api_database
    restart: always
    build:
        context: ./docker/database
        dockerfile: ./Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql:rw
###< doctrine/doctrine-bundle ###

  app:
    container_name: en_shop_api_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: serverName=${PHP_IDE_SERVER_NAME:-en-shop-api}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
    volumes:
      # Commenter la ligne suivante en production
      - ./:/var/www:rw
    extra_hosts:
      - host.docker.internal:host-gateway

  nginx:
    container_name: en_shop_api_nginx
    restart: unless-stopped
    depends_on:
      - app
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    volumes:
      # Commenter la ligne suivante en production
      - ./:/var/www:rw
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:rw
      - ./var/log/nginx:/var/log/nginx:cached

  varnish:
    container_name: en_shop_api_varnish
    restart: unless-stopped
    depends_on:
      - nginx
    build:
      context: ./docker/varnish
      dockerfile: ./Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./docker/varnish/conf:/etc/varnish:ro

  ###> symfony/messenger with rabbitmq ###
  rabbitmq:
    container_name: en_shop_api_rabbitmq
    restart: unless-stopped
    build:
      context: ./docker/rabbitmq
      dockerfile: ./Dockerfile
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  ###< symfony/messenger with rabbitmq ###

  redis:
    container_name: en_shop_api_redis
    restart: unless-stopped
    build:
      context: ./docker/redis
      dockerfile: ./Dockerfile
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
  ###< doctrine/doctrine-bundle ###
  ###> symfony/messenger with rabbitmq ###
  rabbitmq_data:
  ###< symfony/messenger with rabbitmq ###
  redis_data:
