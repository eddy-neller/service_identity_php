name: en_shop_php_service_identity

services:
  database:
    container_name: en_shop_php_service_identity_database
    restart: always
    build:
        context: ./docker/database
        dockerfile: ./Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql:rw

  app:
    restart: unless-stopped
    build: &app_build
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: prod
    image: &app_image en_shop_php_service_identity_app:latest
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERVISOR_ROLE: web

  worker:
    restart: unless-stopped
    build: *app_build
    image: *app_image
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERVISOR_ROLE: worker

  nginx:
    restart: unless-stopped
    depends_on:
      - app
    networks:
      default:
        aliases:
          - identity-nginx
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:rw

  rabbitmq:
    container_name: en_shop_php_service_identity_rabbitmq
    restart: unless-stopped
    build:
      context: ./docker/rabbitmq
      dockerfile: ./Dockerfile
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  redis:
    container_name: en_shop_php_service_identity_redis
    restart: unless-stopped
    build:
      context: ./docker/redis
      dockerfile: ./Dockerfile
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  database_data:
  rabbitmq_data:
  redis_data:
