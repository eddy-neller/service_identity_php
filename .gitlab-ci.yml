# Pipeline de service_identity : analyse statique, style et tests, en parallele.
#
# Image : etape `ci` de docker/app/Dockerfile, soit les extensions PHP de l'image
# deployee plus Composer. La reconstruire apres toute modification de l'etape
# `base` : `make ci-image-push`.
#
# Aucune variable secrete n'est requise. La base Postgres est jetable, et la paire
# JWT est generee par le job : elle ne signe que les tokens de la suite.
image: registry.gitlab.com/en-shop/back-php/serv-identity:ci

stages:
  - test

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

default:
  cache:
    key:
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - composer install --no-scripts --no-progress --prefer-dist

phpstan:
  stage: test
  script:
    - vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress

php-cs-fixer:
  stage: test
  script:
    - vendor/bin/php-cs-fixer fix --dry-run --diff

phpunit:
  stage: test
  services:
    - name: postgres:18-alpine
      alias: database
  variables:
    # Lues par le service Postgres a sa creation, et par .env.dist pour composer
    # DATABASE_URL. Doctrine y ajoute le suffixe `_test`.
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    JWT_PASSPHRASE: ci
  script:
    - bin/console lexik:jwt:generate-keypair -e test --no-interaction
    - bin/console doctrine:database:create -e test --if-not-exists
    - bin/console doctrine:migrations:migrate -e test --no-interaction
    - bin/console doctrine:fixtures:load -e test --no-interaction --group=test
    - vendor/bin/phpunit --display-warnings --display-deprecations --display-phpunit-deprecations --display-notices
