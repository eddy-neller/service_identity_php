framework:
  messenger:
    default_bus: command.bus

    buses:
      command.bus:
        middleware:
          - App\Infrastructure\Symfony\Messenger\CQRS\Middleware\CommandLoggingMiddleware
          - App\Infrastructure\Symfony\Messenger\CQRS\Middleware\UnwrapHandlerFailedExceptionMiddleware
          - App\Infrastructure\Symfony\Messenger\CQRS\Middleware\CacheInvalidationMiddleware
      query.bus:
        middleware:
          - App\Infrastructure\Symfony\Messenger\CQRS\Middleware\QueryLoggingMiddleware
          - App\Infrastructure\Symfony\Messenger\CQRS\Middleware\UnwrapHandlerFailedExceptionMiddleware
          - App\Infrastructure\Symfony\Messenger\CQRS\Middleware\QueryCacheMiddleware
      event.bus:
        default_middleware:
          allow_no_handlers: true
        middleware:
          - doctrine_ping_connection
          - doctrine_close_connection
      async.bus: ~

    failure_transport: failed_domain_events

    transports:
      domain_events:
        dsn: "doctrine://default?queue_name=domain_events&auto_setup=false"
        failure_transport: failed_domain_events
        retry_strategy:
          max_retries: 6
          delay: 10000
          multiplier: 2
          max_delay: 300000
          jitter: 0.1
      failed_domain_events:
        dsn: "doctrine://default?queue_name=failed_domain_events&auto_setup=false"
        options:
          use_notify: false
      async:
        dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
        failure_transport: failed_async
        retry_strategy:
          max_retries: 6
          delay: 30000
          multiplier: 2
          max_delay: 900000
          jitter: 0.1
      failed_async:
        dsn: "doctrine://default?queue_name=failed_async&auto_setup=false"
        options:
          use_notify: false

    routing:
      App\Domain\SharedKernel\Event\DomainEventInterface: domain_events
      App\Application\Shared\Messenger\Message\SendEmailMessage: async

when@test:
  framework:
    messenger:
      transports:
        domain_events: "sync://"
