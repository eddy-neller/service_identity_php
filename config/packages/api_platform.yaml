api_platform:
    title: "%env(APP_TITLE)%"
    version: "%env(APP_VERSION)%"
    show_webby: false
    mapping:
        paths:
            - "%kernel.project_dir%/src/Entity"
            - "%kernel.project_dir%/presentation/src"
    formats:
        json: ["application/json"]
    docs_formats:
        html: ["text/html"]
    error_formats:
        json: ["application/json"]
    defaults:
        stateless: true
        cache_headers:
            max_age: 0
            shared_max_age: 0
            vary: ["Content-Type", "Authorization", "Origin"]
            etag: true
    http_cache: ~
    # Résolution par is_a() : le 1er match dans l'ordre gagne → spécifiques, puis catégories, puis fallback.
    exception_to_status:
        # Cas spécifiques (sémantique propre à la sécurité / rate-limit, pas une simple catégorie)
        App\Domain\User\Exception\Security\InvalidCredentialsException: 401
        App\Domain\User\Exception\Security\InvalidRefreshTokenException: 401
        App\Domain\User\Exception\Security\AccountNotActivatedException: 403
        App\Domain\User\Exception\Security\UserLockedException: 423
        App\Domain\User\Exception\RateLimit\ActivationLimitReachedException: 429
        App\Domain\User\Exception\RateLimit\ResetPasswordLimitReachedException: 429
        # Catégories sémantiques du domaine (interfaces, chaque BC les implémente sur ses feuilles)
        App\Domain\SharedKernel\Exception\InvalidArgumentInterface: 422
        App\Domain\SharedKernel\Exception\ConflictInterface: 409
        App\Domain\SharedKernel\Exception\EntityNotFoundInterface: 404
        # Fallback : toute DomainException non catégorisée (inclut les bases par BC)
        App\Domain\SharedKernel\Exception\DomainException: 400

when@dev:
    api_platform:
        http_cache:
            invalidation:
                enabled: true
                urls: ["%env(VARNISH_URL)%"]

when@prod:
    api_platform:
        http_cache:
            invalidation:
                enabled: true
                urls: ["%env(VARNISH_URL)%"]
