# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Service sans état : ni session, ni cookie. Toute l'identité vient du JWT.
    # Ne pas réintroduire de `session:` sous `when@test` : cela la réactive pour les seuls tests.
    session: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
