# Read the documentation: https://symfony.com/doc/current/bundles/StofDoctrineExtensionsBundle/index.html
# See the official DoctrineExtensions documentation for more details: https://github.com/doctrine-extensions/DoctrineExtensions/tree/main/doc
stof_doctrine_extensions:
    default_locale: en_US
    orm:
        default:
            # `tree` et `sluggable` n'avaient que le catalogue pour usager : l'arbre imbriqué des
            # catégories et les slugs de catégorie/produit sont partis avec lui. Ne restent que
            # `timestampable`, dont dépend `UserEntity`, et `translatable`, dont dépend
            # `LocaleListener` — celui-là même qui tient le repli de locale sans lequel
            # `GET /health` répond 500.
            tree: false
            timestampable: true
            sluggable: false
            translatable: true
