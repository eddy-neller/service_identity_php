# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

# config/services.yaml
imports:
    - { resource: 'services/*.yaml' }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Application\Shared\CQRS\Command\CommandHandlerInterface:
            tags:
                - { name: "messenger.message_handler", bus: "command.bus", method: "handle" }
        App\Application\Shared\CQRS\Query\QueryHandlerInterface:
            tags:
                - { name: "messenger.message_handler", bus: "query.bus", method: "handle" }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/Entity"

    App\Application\:
        resource: "../application/src/"

    App\Infrastructure\:
        resource: "../infrastructure/src/"
        exclude:
            - "../infrastructure/src/Entity"

    App\Presentation\:
        resource: "../presentation/src/"
        exclude:
            - "../presentation/src/**/ApiResource/"
            - "../presentation/src/**/Dto/"

    App\Application\Shared\CQRS\Command\CommandBusInterface:
        alias: App\Infrastructure\Messenger\CQRS\MessengerCommandBus

    App\Application\Shared\CQRS\Query\QueryBusInterface:
        alias: App\Infrastructure\Messenger\CQRS\MessengerQueryBus

when@test:
    services:
        # Purger bouchon référencé par api_platform.http_cache.invalidation.purger.
        # Déclaration explicite : le bloc App\Infrastructure\ ne scanne que
        # infrastructure/src/, pas infrastructure/tests/.
        App\Infrastructure\Tests\Double\HttpCache\NullPurger: ~
