# Surcharges de DEVELOPPEMENT LOCAL uniquement.
#
# Compose charge ce fichier automatiquement ; une production ne le deploie pas. Tout
# ce qui est ici doit donc etre inutile au fonctionnement du service : confort de
# debogage, acces direct depuis l'hote, code monte a chaud.

services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "${POSTGRES_EXPOSED_PORT:-20902}:5432"
###< doctrine/doctrine-bundle ###

  app:
    # Composer et les outils reseau ne vivent que dans cette etape.
    build:
      target: dev
    volumes:
      # Code monte depuis l'hote : l'image `prod` embarque deja le code et ses
      # dependances, ce montage ne sert qu'a voir ses modifications sans reconstruire.
      - ./:/var/www:rw

  worker:
    build:
      target: dev
    volumes:
      - ./:/var/www:rw

  nginx:
    ports:
      - "${NGINX_EXPOSED_PORT:-20900}:80"
    volumes:
      - ./:/var/www:rw
      - ./var/log/nginx:/var/log/nginx:cached
    # `default` DOIT etre liste explicitement : declarer `networks:` sur un service
    # remplace son rattachement implicite, et sans lui nginx perdrait l'acces a `app`
    # (symptome : 502 de la passerelle, qui accuse le mauvais coupable).
    networks:
      default: {}
      edge:
        # Alias explicite, et NON negociable : Compose declare deja `nginx` comme
        # alias sur chaque reseau rejoint — or les deux stacks ont un service nomme
        # `nginx`, donc `nginx` est ambigu sur le reseau partage. La passerelle vise
        # cet alias-ci, qui est unique. C'est l'equivalent d'un Service Kubernetes,
        # et il survit a la disparition des `container_name`.
        aliases:
          - service-identity

###> symfony/mailer ###
  mailer:
    container_name: en_shop_php_service_identity_mailer
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_EXPOSED_PORT:-20906}:1025"
      - "${MAILPIT_HTTP_EXPOSED_PORT:-20907}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> symfony/messenger with rabbitmq ###
  rabbitmq:
    ports:
      - "${RABBITMQ_EXPOSED_PORT:-20908}:5672" # AMQP protocol
      - "${RABBITMQ_MANAGEMENT_EXPOSED_PORT:-20909}:15672" # Management UI
###< symfony/messenger with rabbitmq ###

  redis:
    ports:
      - "${REDIS_EXPOSED_PORT:-20903}:6379"

# Seul `nginx` rejoint le reseau de la passerelle. Postgres, RabbitMQ et Redis
# restent sur le reseau par defaut de la stack : c'est ce qui garantit *par la
# topologie* qu'aucun autre service ne peut joindre cette base.
#
# Reseau `external` : il doit exister avant `docker compose up`, sinon la stack
# refuse de monter. C'est `make up` qui le cree (idempotent), pour que le service
# continue de demarrer seul sans dependre de la passerelle.
networks:
  edge:
    external: true
    name: en_shop_php_edge
